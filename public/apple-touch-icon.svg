<!-- This is a placeholder for apple-touch-icon.png -->
<!-- In a real application, this would be a 180x180 PNG image -->
<!-- For now, we'll create a simple SVG that can be converted to PNG -->
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#gradient)"/>
  <g transform="translate(90,90)">
    <!-- Ice skate icon -->
    <path d="M-30,-20 L30,-20 Q35,-20 35,-15 L35,15 Q35,20 30,20 L-30,20 Q-35,20 -35,15 L-35,-15 Q-35,-20 -30,-20 Z" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#2563eb"/>
    <path d="M-25,25 L25,25" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <!-- Sparkles -->
    <circle cx="-15" cy="-30" r="2" fill="white" opacity="0.8"/>
    <circle cx="20" cy="-25" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="-20" cy="30" r="1" fill="white" opacity="0.7"/>
    <circle cx="25" cy="35" r="1.5" fill="white" opacity="0.5"/>
  </g>
</svg>